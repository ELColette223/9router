# Personal deployment image: build on every push to master and publish to
# this fork's own GHCR namespace (ghcr.io/<owner>/9router). Independent of the
# upstream tag-driven release workflow, which keeps publishing decolua/9router.
#
# First run creates the package as PRIVATE — flip it to public once under
# Your profile → Packages → 9router → Package settings if the server should
# pull without registry credentials.

name: Build and Publish Custom Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: docker-custom-${{ github.repository }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        run: |
          TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "Smoke testing $TAG"
          docker run -d --name smoke -p 20128:20128 -e DATA_DIR=/app/data "$TAG"
          for i in $(seq 1 45); do
            if curl -sf "http://127.0.0.1:20128/api/health" > /dev/null; then
              echo "Image is healthy: $TAG"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Health check failed"
          docker logs smoke
          exit 1
